# Fixed model catalog, filled in by hand on 2026-11-10; the gpt-6.1-sol,
# gpt-6.1-terra and gpt-6-luna entries on 2026-11-11. Every figure records
# its source and query date so runs can be repriced and audited.
#
# Billing. DeepSeek models are billed per token on the official API, with
# peak rates on weekdays 01:00-04:00 and 06:00-10:00 UTC; Chinese public
# holidays are off-peak all day and must be listed in exceptDates as they
# are announced. Claude Code and Codex models run through the operator's
# subscriptions (Claude Max 5x, ChatGPT Plus): tokens are recorded, cash
# cost is the flat plan fee. Provider names match what the harness records:
# DSH routes for DeepSeek, the adapter names claude-code and codex otherwise.
#
# Taste ranks. Placements on public blind-test leaderboards: Arena WebDev and
# Design Arena for visual design, Arena Creative Writing for copy. A
# leaderboard entry names its reasoning setting, which may differ from the
# setting a run uses. Ranges are recorded as rank..rankUpper. Placements were
# read from the pages on the query date and should be re-checked against the
# live boards before publication. Models absent from a board have no entry.
version: 1
models:
- provider: deepseek-official
  model: deepseek-flash
  price:
    currency: USD
    inputPerMTok: 0.15
    outputPerMTok: 0.6
    cacheReadPerMTok: 0.003
    peak:
      inputPerMTok: 0.3
      outputPerMTok: 1.2
      cacheReadPerMTok: 0.006
      windows:
      - weekdays: [1, 2, 3, 4, 5]
        start: '01:00'
        end: '04:00'
      - weekdays: [1, 2, 3, 4, 5]
        start: '06:00'
        end: '10:00'
      exceptDates:
      - '2027-01-01'
    source:
      name: DeepSeek API pricing
      url: https://api-docs.deepseek.com/quick_start/pricing
      queriedAt: '2026-11-10'
  taste:
    visual:
    - source:
        name: Arena WebDev leaderboard (Code Arena, Overall)
        url: https://arena.ai/leaderboard/webdev
