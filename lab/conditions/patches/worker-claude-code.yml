# Claude Code as delegation targets, one per pinned model, through the local
# Claude Code login (the operator's Claude subscription). Each delegation is a
# fresh unattended Claude Code session in the parent's workspace; its native
# usage is appended to <DSH_HOME>/lab-usage.jsonl for the harness.
#
# The adapter runs the Claude Code bundled with its Agent SDK (0.3.311,
# Claude Code 2.1.311), pinned by the DSH lockfile.
#
# permissionMode "auto" lets Claude Code's own classifier approve tool use
# without a person, so a worker can edit and run commands unattended.
- insert:
    - id: subagent-claude-fable
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-fable
        model: claude-fable-5-2
        permissionMode: auto
        usageLog: !!js dshHomePath('lab-usage.jsonl')
    - id: tool-subagent-claude-fable
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-fable
        toolName: subagent_claude_fable
        maxDepth: provider-managed
    - id: subagent-claude-opus
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-opus
        model: claude-opus-5-5
        permissionMode: auto
        usageLog: !!js dshHomePath('lab-usage.jsonl')
    - id: tool-subagent-claude-opus
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-opus
        toolName: subagent_claude_opus
        maxDepth: provider-managed
    - id: subagent-claude-sonnet
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-sonnet
        model: claude-sonnet-5-5
        permissionMode: auto
        usageLog: !!js dshHomePath('lab-usage.jsonl')
    - id: tool-subagent-claude-sonnet
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-sonnet
        toolName: subagent_claude_sonnet
        maxDepth: provider-managed
    - id: subagent-claude-haiku
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-haiku
        model: claude-haiku-5-5
        permissionMode: auto
        usageLog: !!js dshHomePath('lab-usage.jsonl')
    - id: tool-subagent-claude-haiku
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-haiku
        toolName: subagent_claude_haiku
        maxDepth: provider-managed
